    - "&8▪ &7{kind}"
    - "&8▪ &7Rows: &f{rows} &8▪ &7Items: &f{items}"
    - "&8{file}"
    - ""
    - "&#7DD3FC» &fClick &7to edit"
  kind-built-in: "Plugin menu"
  kind-custom: "Custom menu &8(&f{command}&8)"
  kind-theme: "Shared look &8(buttons and filler of every menu)"
  new-name: "&#7DD3FC+ New menu"
  new-lore:
