  hint-edit: "&7Click an &fitem &7to edit &8| &7an &fempty slot &7to add one"
  hint-rearrange: "&7Click an item, then where it goes"
  hint-list: "&7Click slots to add / remove them from the list"
  options-name: "&#7DD3FCMenu options"
  options-lore:
