    - "&7becomes its command when it is free."
  type-menu-id: "{prefix}&7Type the new menu's name (a-z, 0-9, _ -), or &fcancel&7."
  bad-name: "{prefix}&#F87171✖ &7Use 1-24 characters: a-z, 0-9, _ or -."
  menu-exists: "{prefix}&#F87171✖ &7A menu called {id} already exists."
  menu-created: "{prefix}&#4ADE80✔ &7Made menu &f{id}&7. Open it with &f{command}&7."
  menu-created-no-command: "{prefix}&#4ADE80✔ &7Made menu &f{id}&7. That name is a command already: set another in Menu options."
  edit-title-edit: "&8✎ {id} &7» rows {from}-{to} of {rows}"
  edit-title-rearrange: "&8✎ {id} &7» rearrange"
  edit-title-list: "&8✎ {id} &7» list slots"
  info-name: "&#7DD3FCEditing: &f{id}"
  info-edit:
    - "&7The 4 middle rows show the menu."
    - "&8▪ &7Click an &fitem &7to edit it"
    - "&8▪ &7Click an &fempty slot &7to add one"
    - "&8▪ &7Click a &flist slot &7for list options"
    - "&8▪ &7Arrows (top / bottom right) scroll"
  info-rearrange:
