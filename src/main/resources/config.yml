# ALBCore configuration
#
# Restart the server after changing the database or player-data sections.
# "/albcore reload" reloads everything else (webhooks, gui, lang.yml, menus/common.yml).
#
# This file contains passwords and webhook URLs. It lives on the server only: never commit it to git.

config-version: 1

database:
  # Shared database for ALBCore and the plugins built on it (ALBLevel, ALBSkills...).
  # sqlite = a local file, good for test servers. mysql = your host's MySQL/MariaDB server.
  type: sqlite

  # Added in front of every table name. Letters, digits and _ only.
  table-prefix: "alb_"

  sqlite:
    # Path inside plugins/ALBCore/ (or an absolute path).
    file: "database.db"

  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    use-ssl: false
    # Extra JDBC connection properties, for example:
    #   serverTimezone: "UTC"
    properties: {}

  # Connection pool. Used by MySQL only; SQLite always uses one connection.
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 10000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    # 0 = off. Set to e.g. 300000 if your host closes idle connections.
    keepalive-time-ms: 0

player-data:
  # Where per-player data (the PlayerData API) is stored: yaml, sqlite or mysql.
  #   yaml   = one file per player in plugins/ALBCore/playerdata/
  #   sqlite / mysql = a table in the database configured above.
  # If this is a different SQL type than database.type, player data opens its own small connection.
  # To move existing data: change this, restart, then run "/albcore playerdata import <old type>".
  storage: yaml

  # How often changed player data is saved in the background.
  autosave-interval-seconds: 300

  # How long a joining player may wait for their data before they are refused.
  load-timeout-seconds: 10

  # Shown to a player whose data could not be loaded (they are not let in, so nothing is overwritten).
  load-failed-message: "&cYour player data could not be loaded. Please try again in a moment."

gui:
  # Clicks of one player on menu buttons that come closer together than this are ignored
  # (one fast double tap must not buy twice). 0 = off.
  click-cooldown-ms: 100
  # Menu sounds of every ALB plugin: "<sound key> <volume> <pitch>", or "" for no sound.
  sounds:
    click: "minecraft:ui.button.click 0.4 1.2"
    toggle-on: "minecraft:block.note_block.pling 0.5 1.7"
    toggle-off: "minecraft:block.note_block.pling 0.5 0.9"
    denied: "minecraft:entity.villager.no 0.5 1.1"
    success: "minecraft:entity.player.levelup 0.5 1.6"
  # The look of the menus (frame, back / close / page buttons) is in menus/common.yml,
  # shared texts (status lines, click hints) in lang.yml.

discord:
  # Named webhooks for DiscordLogger.on("<name>"). Webhook URLs are secrets.
  webhooks: {}
  # Example:
  # webhooks:
  #   staff:
  #     url: "https://discord.com/api/webhooks/..."
  #     username: "Skyabyss Logs"
  #     avatar-url: ""
